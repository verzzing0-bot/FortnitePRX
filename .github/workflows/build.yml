name: Build PS4 PRX

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Clone GoldHEN SDK into Makefile Path
        uses: actions/checkout@v4
        with:
          repository: GoldHEN/GoldHEN_Plugins_SDK
          path: GoldHEN_Plugins_SDK

      - name: Fix Windows Line Endings (CRLF to LF)
        run: |
          sed -i 's/\r$//' Makefile
          find source -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/\r$//' {} +

      - name: Build PRX with OpenOrbis Toolchain
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.1
          command: make
        env:
          GOLDHEN_SDK: ${{ github.workspace }}/GoldHEN_Plugins_SDK

      - name: Locate and Verify PRX
        run: |
          find . -type f -name "*.prx" -print
          if [ ! -f FortnitePRX.prx ]; then
            echo "::error::FortnitePRX.prx was not generated."
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortnitePRX
          path: FortnitePRX.prx
          if-no-files-found: error
