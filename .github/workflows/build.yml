
name: Build PS4 PRX

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Fortnite PRX
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      # ==========================================
      # 1. Checkout your Windows-developed project
      # ==========================================
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================
      # 2. Checkout official GoldHEN SDK
      # ==========================================
      - name: Checkout GoldHEN SDK
        uses: actions/checkout@v4
        with:
          repository: GoldHEN/GoldHEN_Plugins_SDK
          ref: main
          path: GoldHEN_Plugins_SDK
          fetch-depth: 1

      # ==========================================
      # 3. Verify all required files
      # ==========================================
      - name: Verify Project And SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "========== PROJECT =========="

          pwd
          ls -la

          if [ ! -f Makefile ]; then
            echo "::error::Project Makefile is missing."
            exit 1
          fi

          echo "========== GOLDHEN SDK =========="

          ls -la GoldHEN_Plugins_SDK

          test -f GoldHEN_Plugins_SDK/Makefile
          test -f GoldHEN_Plugins_SDK/crt/crtprx.c
          test -d GoldHEN_Plugins_SDK/include
          test -d GoldHEN_Plugins_SDK/source

          echo "Project and SDK checks passed."

      # ==========================================
      # 4. Pull the official OpenOrbis container
      # ==========================================
      - name: Pull OpenOrbis Toolchain
        run: |
          docker pull openorbisofficial/toolchain:latest

      # ==========================================
      # 5. Build SDK and project inside container
      # ==========================================
      - name: Build PRX
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --user 0:0 \
            --workdir /workspace \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --env GOLDHEN_SDK=/workspace/GoldHEN_Plugins_SDK \
            openorbisofficial/toolchain:latest \
            bash -Eeuo pipefail -c '

              echo "========== OPENORBIS =========="

              : "${OO_PS4_TOOLCHAIN:?OpenOrbis toolchain is not configured}"

              test -f "$OO_PS4_TOOLCHAIN/link.x"
              test -d "$OO_PS4_TOOLCHAIN/include"
              test -d "$OO_PS4_TOOLCHAIN/lib"

              clang --version
              clang++ --version
              ld.lld --version
              llvm-ar --version

              echo "========== GOLDHEN =========="

              : "${GOLDHEN_SDK:?GoldHEN SDK path is missing}"

              test -f "$GOLDHEN_SDK/Makefile"

              echo "SDK: $GOLDHEN_SDK"

              echo "========== BUILD GOLDHEN SDK =========="

              make -C "$GOLDHEN_SDK" clean

              make -C "$GOLDHEN_SDK" \
                PRINTF=1 \
                DEBUGFLAGS=1

              if [ ! -s "$GOLDHEN_SDK/libGoldHEN_Hook.a" ]; then
                echo "GoldHEN static library was not generated."
                exit 1
              fi

              echo "GoldHEN SDK build successful."

              echo "========== PROJECT MAKEFILE =========="

              test -f /workspace/Makefile

              echo "========== BUILD PROJECT =========="

              make --trace -j1

              echo "========== BUILD FINISHED =========="

              echo "Checking generated files..."

              find /workspace \
                -type f \
                -iname "*.prx" \
                -not -path "*/.git/*" \
                -not -path "*/GoldHEN_Plugins_SDK/*" \
                -not -path "*/dist/*" \
                -print

            '

      # ==========================================
      # 6. Find and normalize compiled PRX
      # ==========================================
      - name: Collect PRX
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          mapfile -d "" PRX_FILES < <(
            find . \
              -type f \
              -iname "*.prx" \
              -not -path "./.git/*" \
              -not -path "./GoldHEN_Plugins_SDK/*" \
              -not -path "./dist/*" \
              -print0
          )

          echo "========== GENERATED PRX FILES =========="

          printf '%s\n' "${PRX_FILES[@]}"

          if [ "${#PRX_FILES[@]}" -eq 0 ]; then
            echo "::error::No PRX files were generated."
            exit 1
          fi

          SELECTED=""

          for FILE in "${PRX_FILES[@]}"; do
            LOWER="${FILE,,}"

            if [[ "$LOWER" == *fortnite*.prx ]]; then
              if [ -n "$SELECTED" ]; then
                echo "::error::Multiple Fortnite PRX files found."
                exit 1
              fi

              SELECTED="$FILE"
            fi
          done

          if [ -z "$SELECTED" ]; then
            if [ "${#PRX_FILES[@]}" -eq 1 ]; then
              SELECTED="${PRX_FILES[0]}"
            else
              echo "::error::Multiple PRX files found; cannot identify the Fortnite plugin."
              exit 1
            fi
          fi

          echo "Selected: $SELECTED"

          install -m 0644 "$SELECTED" dist/FortnitePRX.prx

          test -s dist/FortnitePRX.prx

          echo "========== FINAL FILE =========="

          ls -lh dist/FortnitePRX.prx
          sha256sum dist/FortnitePRX.prx

      # ==========================================
      # 7. Upload finished artifact
      # ==========================================
      - name: Upload Fortnite PRX
        uses: actions/upload-artifact@v4
        with:
          name: FortnitePRX
          path: dist/FortnitePRX.prx
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
