name: Build PS4 PRX

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Clone GoldHEN SDK
      run: git clone https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git

    - name: Build with OpenOrbis Docker
      run: |
        docker run --rm -v "$PWD":/workspace -w /workspace ghcr.io/openorbis/openorbis-ps4-toolchain:latest make

    - name: Upload PRX
      uses: actions/upload-artifact@v4
      with:
        name: FortnitePRX
        path: FortnitePRX.prx
