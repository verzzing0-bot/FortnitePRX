name: Build PS4 PRX

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone GoldHEN SDK
        uses: actions/checkout@v4
        with:
          repository: GoldHEN/GoldHEN_Plugins_SDK
          path: GoldHEN_Plugins_SDK

      - name: Build PRX with OpenOrbis Toolchain
        uses: OpenOrbis/toolchain-action@main
        with:
          version: latest
          command: make

      - name: Locate PRX Output
        run: |
          find . -type f -name "*.prx" -print
          if [ ! -f FortnitePRX.prx ]; then
            echo "::error::FortnitePRX.prx was not generated."
            exit 1
          fi

      - name: Upload PRX
        uses: actions/upload-artifact@v4
        with:
          name: FortnitePRX
          path: FortnitePRX.prx
          if-no-files-found: error
