
name: Build PS4 PRX

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Fortnite PRX
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      # 1. Download project and its submodules
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 2. Download the actual GoldHEN SDK
      - name: Checkout GoldHEN SDK
        uses: actions/checkout@v4
        with:
          repository: GoldHEN/GoldHEN_Plugins_SDK
          ref: main
          path: GoldHEN_Plugins_SDK
          fetch-depth: 1

      # 3. Verify repository layout
      - name: Verify Build Files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== PROJECT ====="
          pwd
          ls -la

          test -f Makefile || {
            echo "::error::Root Makefile is missing."
            exit 1
          }

          echo "===== GOLDHEN SDK ====="
          ls -la GoldHEN_Plugins_SDK

          test -f GoldHEN_Plugins_SDK/Makefile
          test -f GoldHEN_Plugins_SDK/crt/crtprx.c
          test -d GoldHEN_Plugins_SDK/include
          test -d GoldHEN_Plugins_SDK/source

          echo "===== PLUGIN SOURCES ====="
          if [ -d plugin_src ]; then
            find plugin_src -maxdepth 3 -type f \
              \( -name Makefile -o -name '*.c' -o -name '*.cpp' \) \
              -print
          else
            echo "No plugin_src directory; checking project-specific Makefile."
          fi

      # 4. Install the official OpenOrbis container
      - name: Pull OpenOrbis Toolchain
        run: docker pull openorbisofficial/toolchain:latest

      # 5. Build using the official toolchain
      - name: Compile PRX
        shell: bash
        run: |
          set -Eeuo pipefail

          docker run --rm \
            --user 0:0 \
            --workdir /workspace \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --env GOLDHEN_SDK=/workspace/GoldHEN_Plugins_SDK \
            --env OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK \
            openorbisofficial/toolchain:latest \
            bash -Eeuo pipefail -c '

              echo "===== TOOLCHAIN CHECK ====="

              : "${OO_PS4_TOOLCHAIN:?Missing OpenOrbis SDK}"

              test -f "$OO_PS4_TOOLCHAIN/link.x"
              test -d "$OO_PS4_TOOLCHAIN/include"
              test -d "$OO_PS4_TOOLCHAIN/lib"

              clang --version
              clang++ --version
              ld.lld --version
              llvm-ar --version

              echo "===== GOLDHEN CHECK ====="

              : "${GOLDHEN_SDK:?Missing GoldHEN SDK}"

              test -f "$GOLDHEN_SDK/Makefile"
              test -f "$GOLDHEN_SDK/crt/crtprx.c"

              echo "GoldHEN SDK: $GOLDHEN_SDK"
              echo "OpenOrbis: $OO_PS4_TOOLCHAIN"

              echo "===== PROJECT MAKEFILE ====="

              sed -n "1,220p" Makefile

              echo "===== COMPILATION ====="

              make --trace -j1

              echo "===== BUILD OUTPUTS ====="

              if [ -d bin/plugins ]; then
                find bin/plugins -maxdepth 4 -type f -print
              fi

              find . -type f -iname "*.prx" \
                ! -path "./.git/*" \
                ! -path "./GoldHEN_Plugins_SDK/*" \
                ! -path "./dist/*" \
                -print

            ' 2>&1 | tee build.log

      # 6. Locate and normalize the PRX
      - name: Collect Fortnite PRX
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          mapfile -d "" PRX_FILES < <(
            find . -type f -iname "*.prx" \
              ! -path "./.git/*" \
              ! -path "./GoldHEN_Plugins_SDK/*" \
              ! -path "./dist/*" \
              -print0
          )

          echo "===== FOUND PRX FILES ====="
          printf '%s\n' "${PRX_FILES[@]}"

          if [ "${#PRX_FILES[@]}" -eq 0 ]; then
            echo "::error::Build completed without producing a PRX."
            echo "Inspect build.log and the bin directory."
            find . -maxdepth 5 -type f -print
            exit 1
          fi

          SELECTED=""
          MATCHES=()

          for FILE in "${PRX_FILES[@]}"; do
            LOWER="${FILE,,}"

            if [[ "$LOWER" == *fortnite*.prx ]]; then
              MATCHES+=("$FILE")
            fi
          done

          if [ "${#MATCHES[@]}" -eq 1 ]; then
            SELECTED="${MATCHES[0]}"
          elif [ "${#PRX_FILES[@]}" -eq 1 ]; then
            SELECTED="${PRX_FILES[0]}"
          else
            echo "::error::Multiple PRX files found; cannot identify the Fortnite output."
            exit 1
          fi

          cp "$SELECTED" dist/FortnitePRX.prx

          test -s dist/FortnitePRX.prx

          echo "===== FINAL ARTIFACT ====="
          ls -lh dist/FortnitePRX.prx
          sha256sum dist/FortnitePRX.prx

      # 7. Upload compiled plugin
      - name: Upload Fortnite PRX
        uses: actions/upload-artifact@v4
        with:
          name: FortnitePRX
          path: dist/FortnitePRX.prx
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # 8. Always preserve compiler logs
      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FortnitePRX-Build-Logs
          path: build.log
          if-no-files-found: warn
          retention-days: 7
