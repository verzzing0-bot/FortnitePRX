name: Build PS4 PRX

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Clone GoldHEN SDK
      run: git clone https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git

    - name: Build PRX
      uses: OpenOrbis/toolchain-action@main
      with:
        version: latest
        command: make

    - name: Upload PRX
      uses: actions/upload-artifact@v4
      with:
        name: FortnitePRX
        path: FortnitePRX.prx
