name: Build PS4 PRX

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git clang lld cmake
        
    - name: Setup OpenOrbis Toolchain
      run: |
        git clone https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /opt/OpenOrbis-PS4-Toolchain
        cd /opt/OpenOrbis-PS4-Toolchain && ./build.sh
        echo "OO_PS4_TOOLCHAIN=/opt/OpenOrbis-PS4-Toolchain" >> $GITHUB_ENV
        
    - name: Clone GoldHEN SDK
      run: git clone https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git
      
    - name: Build PRX
      run: make
      
    - name: Upload PRX
      uses: actions/upload-artifact@v3
      with:
        name: FortnitePRX
        path: FortnitePRX.prx
